name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.winson.sixyao SixYaoApp
          cd myapp
          cordova platform add android
          rm -rf www/*
          cp ../index.html www/
          
          # 【核心修改】使用 sed 指令在 config.xml 中加入鎖定橫向 (landscape) 的設定
          sed -i '/<\/widget>/i \    <preference name="Orientation" value="landscape" \/>' config.xml

      - name: Build APK
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SixYao-Debug-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
