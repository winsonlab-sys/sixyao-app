<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes">
    <title>專業六爻排盤系統 V7.0 (六親邏輯修正版)</title>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 10px;
            max-width: 900px;
            margin: 0 auto;
            transform-origin: top center;
            transition: transform 0.1s ease-out;
        }
        h1 { text-align: center; color: #ffca28; margin: 5px 0 15px 0; font-size: 22px; letter-spacing: 2px; }
        .card {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .form-group {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        label { font-size: 13px; color: #b0b0b0; width: 75px; font-weight: bold; }
        select, button, input, textarea {
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 4px;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
        }
        select { flex: 1; min-width: 65px; }
        input[type="text"] { flex: 1; background: #151515; border: 1px solid #555; color: #fff; }
        textarea { 
            width: 100%; 
            box-sizing: border-box; 
            background: #151515; 
            border: 1px solid #555; 
            color: #fff; 
            font-family: inherit;
            resize: vertical;
        }
        button {
            background-color: #ff9800;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #ffa726; }
        button.secondary { background-color: #444; color: #fff; }
        button.action-btn { background-color: #0284c7; color: #fff; font-size: 12px; padding: 5px 10px; }
        button.action-btn:hover { background-color: #0369a1; }
        button.action-btn.active { background-color: #16a34a; }
        
        .manual-selectors {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
            background: #181818;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
        }
        .yao-select-row { display: flex; align-items: center; gap: 10px; }
        .yao-label { width: 50px; font-size: 13px; color: #ffca28; font-weight: bold; text-align: right; }
        .yao-select-row select { flex: 1; background: #222; border-color: #444; }
        
        /* 排盤結果區塊 */
        .output-container {
            background-color: #f8fafc;
            color: #1e293b;
            padding: 15px 20px;
            border-radius: 6px;
            font-family: "PingFang TC", "Microsoft JhengHei", monospace;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.6;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            max-width: 100%;
            box-sizing: border-box;
        }
        
        .meta-section { margin-bottom: 10px; font-size: 13px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .meta-line { margin-bottom: 4px; }
        .highlight-red { color: #dc2626; }
        .highlight-blue { color: #2563eb; }
        
        .shensha-line {
            display: none;
            margin-top: 4px; 
            font-weight: normal; 
            color: #475569;
            background-color: #f1f5f9;
            padding: 6px;
            border-radius: 4px;
        }
        
        .paipan-grid { 
            display: flex; 
            width: 100%; 
            margin-top: 5px; 
            justify-content: flex-start;
        }
        
        .liushen-col { 
            width: 55px; 
            display: flex; 
            flex-direction: column; 
            color: #475569; 
            padding-top: 32px; 
        }
        
        .fushen-col {
            width: 95px;
            display: none; 
            flex-direction: column;
            padding-top: 32px;
            border-right: 1px dashed #cbd5e1;
            margin-right: 10px;
        }
        
        .gua-col { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            max-width: 100%;
        }
        
        .gua-header { 
            display: flex; 
            border-bottom: 1px solid #cbd5e1; 
            padding-bottom: 3px; 
            margin-bottom: 8px; 
            color: #0f172a; 
        }
        .gua-title { width: 200px; text-align: left; font-size: 15px; color: #0284c7; font-weight: 800; padding-left: 5px; }
        .gua-title.change-title { width: 240px; padding-left: 20px; }

        .yao-row { display: flex; align-items: center; height: 32px; }
        
        .yao-part { width: 200px; display: flex; align-items: center; position: relative; margin-right: 15px; }
        .yao-part.change-part { width: 240px; margin-right: 0; } 
        
        .liuqin-zhi { width: 75px; display: inline-block; letter-spacing: 0.5px; white-space: nowrap; }
        .nayin-box { width: 65px; display: none; font-size: 11px; color: #64748b; font-weight: normal; white-space: nowrap; text-align: left; }
        .yao-line-container { width: 85px; display: inline-flex; align-items: center; justify-content: center; }
        .shi-ying { width: 25px; text-align: center; color: #b45309; font-size: 13px; }
        .dong-mark { width: 35px; text-align: center; color: #dc2626; font-weight: bold; font-size: 14px; }
        
        .yao-line-pic { display: inline-block; height: 10px; vertical-align: middle; }
        .yao-line-pic.yang { width: 75px; background-color: #000; }
        .yao-line-pic.yin { width: 75px; background-image: linear-gradient(to right, #000 33.3%, transparent 33.3%, transparent 66.6%, #000 66.6%); }

        .history-list { max-height: 150px; overflow-y: auto; margin-top: 10px; }
        .history-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px; background: #262626; border-bottom: 1px solid #333; font-size: 12px;
        }
        .history-item:hover { background: #333; }
        .history-info { flex: 1; cursor: pointer; }

        .notes-section {
            margin-top: 15px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 12px;
            color: #1e293b;
        }
        .notes-title {
            font-size: 13px;
            color: #475569;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zoom-controls {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 6px;
            z-index: 9999;
            background: rgba(0,0,0,0.6);
            padding: 4px;
            border-radius: 6px;
        }
        .zoom-btn {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            width: 38px;
            height: 38px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .zoom-btn:active { background: #ff9800; color: #000; }
    </style>
</head>
<body>

    <h1>專業六爻排盤系統</h1>

    <div class="card">
        <div class="form-group">
            <label>所問之事：</label>
            <input type="text" id="memo" placeholder="例如：測今年財運、某項目能否成功...">
        </div>

        <div class="form-group">
            <label>占卜時間：</label>
            <select id="year" onchange="syncGanZhi()"></select>年
            <select id="month" onchange="syncGanZhi()"></select>月
            <select id="date" onchange="syncGanZhi()"></select>日
            <select id="hour" onchange="updateDisplay()"></select>時
            <select id="minute" onchange="updateDisplay()"></select>分
        </div>

        <div class="form-group">
            <label>對應干支：</label>
            <span style="font-size:12px; color:#aaa;">月支:</span>
            <select id="month-zhi" onchange="updateDisplay()">
                <option value="子">子月(十一月)</option><option value="丑">丑月(十二月)</option><option value="寅">寅月(正月)</option><option value="卯">卯月(二月)</option>
                <option value="辰">辰月(三月)</option><option value="巳">巳月(四月)</option><option value="午">午月(五月)</option><option value="未">未月(六月)</option>
                <option value="申">申月(七月)</option><option value="酉">酉月(八月)</option><option value="戌">戌月(九月)</option><option value="亥">亥月(十月)</option>
            </select>
            <span style="font-size:12px; color:#aaa;">日課:</span>
            <select id="day-gan" onchange="updateDisplay()"></select>
            <select id="day-zhi" onchange="updateDisplay()"></select>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button style="flex: 2;" onclick="autoRoll()">電腦起卦 (隨機產生六爻)</button>
            <button class="secondary" style="flex: 1;" onclick="manualSubmit();">手動排盤</button>
        </div>

        <div class="manual-selectors">
            <div class="yao-select-row">
                <span class="yao-label">上爻：</span>
                <select id="yao-5"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">五爻：</span>
                <select id="yao-4"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">四爻：</span>
                <select id="yao-3"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">三爻：</span>
                <select id="yao-2"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">二爻：</span>
                <select id="yao-1"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">初爻：</span>
                <select id="yao-0"></select>
            </div>
        </div>
    </div>

    <div id="board-controls" style="margin-bottom:10px; display:none; text-align:right; gap:10px; justify-content:flex-end;">
        <button id="btn-shensha" class="action-btn" onclick="toggleShensha()">顯示 神煞</button>
        <button id="btn-fushen" class="action-btn" onclick="toggleFushen()">顯示 藏爻</button>
        <button id="btn-nayin" class="action-btn" onclick="toggleNayin()">顯示 納音</button>
    </div>

    <div id="paipan-board" class="output-container" style="display:none;">
        <div id="board-content"></div>
        
        <div class="notes-section">
            <div class="notes-title">
                <span>📝 斷卦筆記（內容自動儲存至當前紀錄）</span>
                <span id="save-status" style="color: #16a34a; font-weight: normal; font-size: 11px;"></span>
            </div>
            <textarea id="gua-notes" rows="4" placeholder="在此輸入此卦的吉凶判斷、應期、神煞取用等分析..." oninput="autoSaveNotes()"></textarea>
        </div>
    </div>

    <div class="card" style="margin-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #444; padding-bottom:5px;">
            <h3 style="margin:0; font-size:14px; color:#ffca28;">歷史占卦紀錄</h3>
            <button style="font-size:11px; padding:2px 6px; background:#dc2626; color:#fff;" onclick="clearHistory()">清空紀錄</button>
        </div>
        <div id="history-container" class="history-list"></div>
    </div>

    <div class="zoom-controls">
        <div class="zoom-btn" onclick="adjustZoom(0.05)">＋</div>
        <div class="zoom-btn" onclick="adjustZoom(-0.05)">－</div>
        <div class="zoom-btn" style="font-size:11px;" onclick="resetZoom()">重設</div>
    </div>

        for(let i=1; i<=31; i++) dSel.options.add(new Option(i, i));
        for(let i=0; i<=23; i++) hSel.options.add(new Option(i+"點 ("+zhis[Math.floor((i+1)%24/2)]+"時)", i));
        for(let i=0; i<=59; i++) minSel.options.add(new Option(i.toString().padStart(2, '0'), i));

        let dgSel = document.getElementById("day-gan");
        let dzSel = document.getElementById("day-zhi");
        gans.forEach(g => dgSel.options.add(new Option(g, g)));
        zhis.forEach(z => dzSel.options.add(new Option(z, z)));

        for(let i=0; i<6; i++) {
            let ySelect = document.getElementById(`yao-${i}`);
            yaoOptions.forEach(opt => { ySelect.options.add(new Option(opt.text, opt.value)); });
            ySelect.value = 1; 
        }

        let now = new Date();
        ySel.value = now.getFullYear();
        mSel.value = now.getMonth() + 1;
        dSel.value = now.getDate();
        hSel.value = now.getHours();
        minSel.value = now.getMinutes();

        syncGanZhi(); 
        renderHistory();
        applyZoom(); 
    };

    function syncGanZhi() {
        let year = parseInt(document.getElementById("year").value);
        let month = parseInt(document.getElementById("month").value);
        let date = parseInt(document.getElementById("date").value);

        let baseDate = new Date(2026, 4, 26); 
        let targetDate = new Date(year, month - 1, date);
        let diffDays = Math.floor((targetDate.getTime() - baseDate.getTime()) / (1000 * 60 * 60 * 24));

        let ganIdx = (6 + (diffDays % 10) + 10) % 10;
        let zhiIdx = (0 + (diffDays % 12) + 12) % 12;

        document.getElementById("day-gan").value = gans[ganIdx];
        document.getElementById("day-zhi").value = zhis[zhiIdx];

        let monthZhiMap = [ "丑","寅","卯","辰","巳","午","未","申","酉","戌","亥","子" ];
        document.getElementById("month-zhi").value = monthZhiMap[(month - 1) % 12];
    }

    function getHourGan(dayGan, hourZhi) {
        let startGans = {"甲":0, "己":0, "乙":2, "庚":2, "丙":4, "辛":4, "丁":6, "壬":6, "戊":8, "癸":8};
        let startIdx = startGans[dayGan];
        let zhiIdx = zhis.indexOf(hourZhi);
        return gans[(startIdx + zhiIdx) % 10];
    }

    function getMonthGan(yearGan, monthZhi) {
        let startGans = {"甲":2, "己":2, "乙":4, "庚":4, "丙":6, "辛":6, "丁":8, "壬":8, "戊":0, "癸":0};
        let startIdx = startGans[yearGan];
        let offset = (zhis.indexOf(monthZhi) - 2 + 12) % 12;
        return gans[(startIdx + offset) % 10];
    }

    function checkChongHe(zhisArr) {
        const chongPairs = [["子","午"], ["午","子"], ["丑","未"], ["未","丑"], ["寅","申"], ["申","寅"], ["卯","酉"], ["酉","卯"], ["辰","戌"], ["戌","辰"], ["巳","亥"], ["亥","巳"]];
        const hePairs = [["子","丑"], ["丑","子"], ["寅","亥"], ["亥","寅"], ["卯","戌"], ["戌","卯"], ["辰","酉"], ["酉","辰"], ["巳","申"], ["申","巳"], ["午","未"], ["未","午"]];
        let isChong = true; let isHe = true;
        for(let i=0; i<3; i++) {
            let zhiLow = zhisArr[i]; let zhiUp = zhisArr[i+3];
            let matchChong = chongPairs.some(p => p[0]===zhiLow && p[1]===zhiUp); if(!matchChong) isChong = false;
            let matchHe = hePairs.some(p => p[0]===zhiLow && p[1]===zhiUp); if(!matchHe) isHe = false;
        }
        if(isChong) return " (六沖)";
        if(isHe) return " (六合)";
        return "";
    }

    function buildGuaDetails(guaArr) {
        let lowStr = guaArr.slice(0,3).join(""); let upStr = guaArr.slice(3,6).join("");
        let lowName = baguaCode[lowStr]; let upName = baguaCode[upStr];
        let shi = 1; let gong = lowName; 
        if (lowStr === upStr) { shi = 6; gong = lowName; } 
        else {
            let diff = [];
            for(let i=0; i<3; i++) if(guaArr[i] !== guaArr[i+3]) diff.push(i+1);
            if(diff.length === 1) shi = diff[0];
            else if(diff.length === 2) { shi = (diff.includes(1)&&diff.includes(2))? 4 : 5; }
            else if(diff.length === 3) shi = 3;
            gong = upName; 
        }
        let gansOut = []; let zhisOut = [];
        let lowData = naJiaBase[lowName].low; let upData = naJiaBase[upName].up;
        for(let i=0; i<3; i++) { gansOut.push(lowData.gan[i]); zhisOut.push(lowData.zhi[i]); }
        for(let i=0; i<3; i++) { gansOut.push(upData.gan[i]); zhisOut.push(upData.zhi[i]); }
        let combinedKey = upName + lowName;
        let rawName = guaName64[combinedKey] || customGuaNames[combinedKey] || (baguaMing[upName] + baguaMing[lowName] + "卦");
        let finalGong = bagongMap[rawName] || gong;
        const pureGuaNames = ["乾為天","坤為地","震為雷","巽為風","坎為水","離為火","艮為山","兌為澤"];
        if(pureGuaNames.includes(rawName)) { shi = 6; } else {
            let pureArr = [];
            if(finalGong==="乾") pureArr=[1,1,1,1,1,1]; else if(finalGong==="坤") pureArr=[0,0,0,0,0,0];
            else if(finalGong==="震") pureArr=[1,0,0,1,0,0]; else if(finalGong==="巽") pureArr=[0,1,1,0,1,1];
            else if(finalGong==="坎") pureArr=[0,1,0,0,1,0]; else if(finalGong==="離") pureArr=[1,0,1,1,0,1];
            else if(finalGong==="艮") pureArr=[1,0,0,1,0,0]; else if(finalGong==="兌") pureArr=[0,1,1,0,1,1];
            let diffCount = 0; let firstDiff = -1;
            for(let i=0; i<6; i++) { if(guaArr[i] !== pureArr[i]) { diffCount++; if(firstDiff === -1) firstDiff = i + 1; } }
            if(diffCount === 1) shi = 1; else if(diffCount === 2) shi = 2; else if(diffCount === 3) shi = 3; else if(diffCount === 4) slab = 4; else if(diffCount === 5) shi = 5;
            if(rawName.includes("晉") || rawName.includes("需") || rawName.includes("訟") || rawName.includes("明夷") || rawName.includes("大過") || rawName.includes("隨") || rawName.includes("漸") || rawName.includes("小過")) { shi = 4; }
            if(rawName.includes("大有") || rawName.includes("比") || rawName.includes("同人") || rawName.includes("師") || rawName.includes("恆") || rawName.includes("歸妹") || rawName.includes("蠱") || rawName.includes("頤")) { shi = 3; }
        }
        let chongHeSuffix = checkChongHe(zhisOut);
        return { name: rawName, gong: finalGong, shi: shi, gans: gansOut, zhis: zhisOut, wuxing: naJiaBase[finalGong].wuxing, chongHe: chongHeSuffix };
    }

    function getLiuQin(gongWX, yaoZhi) {
        let yaoWX = wuxing[yaoZhi];
        if (gongWX === yaoWX) return "兄弟";
        if (wuxingRelation[gongWX + "生" + yaoWX]) return "子孫";
        if (wuxingRelation[yaoWX + "生" + gongWX]) return "父母";
        if (gongWX === "土" && yaoWX === "水") return "妻財"; 
        if (gongWX === "金" && yaoWX === "木") return "妻財"; 
        if (wuxingRelation[gongWX + "克" + yaoWX]) return "妻財";
        if (wuxingRelation[yaoWX + "克" + gongWX]) return "官鬼";
        return "未知";
    }

    function getXunKong(dayGan, dayZhi) {
        let start = (zhis.indexOf(dayZhi) - gans.indexOf(dayGan) + 12) % 12;
        return zhis[(start + 10) % 12] + zhis[(start + 11) % 12];
    }

    function getShenSha(dayGan, dayZhi, monthZhi) {
        let sha = {}; const chong = {"子":"午","午":"子","丑":"未","未":"丑","寅":"申","申":"寅","卯":"酉","酉":"卯","辰":"戌","戌":"辰","巳":"亥","亥":"巳"};
        if(["亥","卯","未"].includes(dayZhi)) { sha["將星"]="卯"; sha["桃花"]="子"; sha["驛馬"]="巳"; sha["劫煞"]="申"; sha["華蓋"]="未"; }
        else if(["寅","午","戌"].includes(dayZhi)) { sha["將星"]="午"; sha["桃花"]="卯"; sha["驛馬"]="申"; sha["劫煞"]="亥"; sha["華蓋"]="戌"; }
        else if(["巳","酉","丑"].includes(dayZhi)) { sha["將星"]="酉"; sha["桃花"]="午"; sha["驛馬"]="亥"; sha["劫煞"]="寅"; sha["華蓋"]="丑"; }
        else { sha["將星"]="子"; sha["桃花"]="酉"; sha["驛馬"]="寅"; sha["劫煞"]="巳"; sha["華蓋"]="辰"; }
        sha["災煞"] = chong[sha["將星"]];
        if(["甲","戊"].includes(dayGan)) sha["貴人"]="丑未"; else if(["乙","己"].includes(dayGan)) sha["貴人"]="子申"; else if(["丙","丁"].includes(dayGan)) sha["貴人"]="亥酉"; else if(["庚","辛"].includes(dayGan)) sha["貴人"]="寅午"; else sha["貴人"]="卯巳";
        sha["日祿"] = {"甲":"寅","乙":"卯","丙":"巳","丁":"午","戊":"巳","己":"午","庚":"申","辛":"酉","壬":"亥","癸":"子"}[dayGan];
        sha["羊刃"] = {"甲":"卯","乙":"辰","丙":"午","丁":"未","戊":"午","己":"未","庚":"酉","辛":"戌","壬":"子","癸":"丑"}[dayGan];
        sha["文昌"] = {"甲":"巳","乙":"午","丙":"申","丁":"酉","戊":"申","己":"酉","庚":"亥","辛":"子","壬":"寅","癸":"卯"}[dayGan];
        sha["天醫"] = zhis[(zhis.indexOf(monthZhi) - 1 + 12) % 12];
        sha["天喜"] = {"子":"酉","丑":"戌","寅":"亥","卯":"子","辰":"丑","巳":"寅","午":"卯","未":"辰","申":"巳","酉":"午","戌":"未","亥":"申"}[monthZhi];
        sha["謀星"] = zhis[(zhis.indexOf(sha["華蓋"]) + 1) % 12];
        return sha;
    }

    function calculateCangYaoDetails(mainInfo) {
        let gongName = mainInfo.gong; 
        let gongWX = mainInfo.wuxing;
        
        let mainGuaLiuqins = [];
        for(let i=0; i<6; i++) {
            mainGuaLiuqins.push(getLiuQin(gongWX, mainInfo.zhis[i]));
        }

        let pureArr = [];
        if(gongName==="乾") pureArr=[1,1,1,1,1,1]; else if(gongName==="坤") pureArr=[0,0,0,0,0,0];
        else if(gongName==="震") pureArr=[1,0,0,1,0,0]; else if(gongName==="巽") pureArr=[0,1,1,0,1,1];
        else if(gongName==="坎") pureArr=[0,1,0,0,1,0]; else if(gongName==="離") pureArr=[1,0,1,1,0,1];
        else if(gongName==="艮") pureArr=[1,0,0,1,0,0]; else if(gongName==="兌") pureArr=[0,1,1,0,1,1];
        
        let lowName = baguaCode[pureArr.slice(0,3).join("")]; 
        let upName = baguaCode[pureArr.slice(3,6).join("")];
        let lowData = naJiaBase[lowName].low; 
        let upData = naJiaBase[upName].up;
        
        let pureZhis = [...lowData.zhi, ...upData.zhi];

        let resultList = []; 
        for(let i=0; i<6; i++) {
            let pureLQ = getLiuQin(gongWX, pureZhis[i]);
            let pureWX = wuxing[pureZhis[i]];
            let displayText = `${pureLQ}${pureZhis[i]}${pureWX}`;
            let isFuYao = !mainGuaLiuqins.includes(pureLQ);
            
            resultList.push({
                text: displayText,
                isFu: isFuYao
            });
        }
        return resultList;
    }

        let record = {
            id: currentRecordId || Date.now(),

            hour: document.getElementById("hour").value, minute: document.getElementById("minute").value, 
            dayGan: document.getElementById("day-gan").value, dayZhi: document.getElementById("day-zhi").value,
            monthZhi: document.getElementById("month-zhi").value, gua: [...currentGua],
            notes: notes
        };

        if (existingIndex !== -1) {
            history[existingIndex] = record; 
        } else {
            currentRecordId = record.id; 
            if (history.length > 0 && history[0].memo === memo && history[0].gua.toString() === currentGua.toString() && !notes) { return; }
            history.unshift(record);
        }

        localStorage.setItem("sixyao_history", JSON.stringify(history)); 
        renderHistory();
    }

    function autoSaveNotes() {
        if (!currentRecordId) { currentRecordId = Date.now(); }
        saveToHistory();
        
        let statusSpan = document.getElementById("save-status");
        statusSpan.innerText = "已自動儲存筆記...";
        setTimeout(() => { statusSpan.innerText = ""; }, 1500);
    }

    function renderHistory() {
        let history = JSON.parse(localStorage.getItem("sixyao_history")) || [];
        let container = document.getElementById("history-container");
        if(history.length === 0) { container.innerHTML = `<div style="text-align:center; color:#666; padding:10px; font-size:12px;">暫無占卦紀錄</div>`; return; }
        container.innerHTML = history.map(item => `
            <div class="history-item">
                <div class="history-info" onclick="loadHistory(${item.id})">
                    <span style="color:#ff9800; font-weight:bold;">● [${item.date}]</span> 
                    <span style="color:#fff; margin-left:5px;">${item.memo}</span>
                    ${item.notes ? '<span style="color:#10b981; font-size:11px; margin-left:8px;">[有筆記]</span>' : ''}
                </div>
                <button style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:11px;" onclick="deleteHistory(${item.id}, event)">刪除</button>
            </div>
        `).join("");
    }

    function loadHistory(id) {
        let history = JSON.parse(localStorage.getItem("sixyao_history")) || [];
        let item = history.find(x => x.id === id); if(!item) return;
        
        currentRecordId = item.id; 
        document.getElementById("memo").value = item.memo;
        let parts = item.date.split("/");
        document.getElementById("year").value = parts[0]; document.getElementById("month").value = parts[1]; document.getElementById("date").value = parts[2];
        document.getElementById("hour").value = item.hour; if(item.minute) document.getElementById("minute").value = item.minute; 
        document.getElementById("day-gan").value = item.dayGan; document.getElementById("day-zhi").value = item.dayZhi; document.getElementById("month-zhi").value = item.monthZhi;
        
        currentGua = [...item.gua]; 
        syncGuaToSelectors(); 
        document.getElementById("gua-notes").value = item.notes || "";
        
        updateDisplay();
    }

    function deleteHistory(id, event) {
        if(event) event.stopPropagation(); 
        let history = JSON.parse(localStorage.getItem("sixyao_history")) || [];
        history = history.filter(x => x.id !== id); 
        localStorage.setItem("sixyao_history", JSON.stringify(history)); 
        if(currentRecordId === id) { currentRecordId = null; } 
        renderHistory();
    }

    function clearHistory() { 
        if(confirm("確定要清空所有占卦歷史紀錄嗎？")) { 
            localStorage.clear(); 
            currentRecordId = null;
            document.getElementById("gua-notes").value = "";
            renderHistory(); 
        } 
    }
</script>
</body>
</html>
