<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌詞查詢系統</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #fafafa;
            border: 1px solid #eee;
            border-radius: 5px;
            min-height: 100px;
            white-space: pre-wrap; /* 保持歌詞換行格式 */
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>中 / 日 / 台語 歌詞查詢</h2>
    <div class="input-group">
        <input type="text" id="songInput" placeholder="請輸入歌名 (例如: 晴天 / 𬀩日 / 津軽海峡・冬景色)">
        <button onclick="searchLyrics()">查詢</button>
    </div>

    <div id="result" class="result-box">
        請在上方輸入歌名並按下「查詢」。
    </div>
</div>

<script>
function searchLyrics() {
    const songName = document.getElementById('songInput').value.trim();
    const resultDiv = document.getElementById('result');

    if (!songName) {
        alert('請輸入歌名！');
        return;
    }

    resultDiv.innerHTML = "搜尋中，請稍候...";

    // 方案 A：直接跳轉至 Google 歌詞搜尋（最穩定且合規的方式）
    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(songName + ' 歌詞')}`;
    
    resultDiv.innerHTML = `
        <p>已為您準備好「<strong>${songName}</strong>」的歌詞搜尋連結：</p>
        <p><a href="${searchUrl}" target="_blank" style="color: #007bff; font-weight: bold;">點此在新分頁查看完整合法歌詞</a></p>
        <hr>
        <p style="font-size: 12px; color: #666;">註：由於各音樂平台歌詞皆受版權保護，建議直接前往合法授權平台（如 KKBOX、Musixmatch 或 Google 歌詞專區）瀏覽全文。</p>
    `;

    /* 
    // 方案 B：若您有自己的後端伺服器 API，可以使用 fetch 方式抓取並顯示在頁面上：
    fetch(`https://your-api-domain.com/get-lyrics?song=${encodeURIComponent(songName)}`)
        .then(response => response.json())
        .then(data => {
            if (data.lyrics) {
                resultDiv.textContent = data.lyrics;
            } else {
                resultDiv.textContent = "找不到相關歌詞。";
            }
        })
        .catch(err => {
            resultDiv.textContent = "查詢時發生錯誤，請稍後再試。";
        });
    */
}
</script>

</body>
</html>
