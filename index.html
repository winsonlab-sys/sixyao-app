<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes">
    <title>專業六爻排盤系統 V8.2 (神煞校正放大版)</title>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 10px;
            max-width: 950px;
            margin: 0 auto;
            transform-origin: top center;
            transition: transform 0.1s ease-out;
        }
        h1 { text-align: center; color: #ffca28; margin: 5px 0 15px 0; font-size: 24px; letter-spacing: 2px; }
        .card {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .form-group {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        label { font-size: 14px; color: #b0b0b0; width: 75px; font-weight: bold; }
        select, button, input, textarea {
            padding: 6px 8px;
            font-size: 14px;
            border-radius: 4px;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
        }
        select { flex: 1; min-width: 65px; }
        input[type="text"] { flex: 1; background: #151515; border: 1px solid #555; color: #fff; }
        textarea { 
            width: 100%; 
            box-sizing: border-box; 
            background: #151515; 
            border: 1px solid #555; 
            color: #fff; 
            font-family: inherit;
            resize: vertical;
        }
        button {
            background-color: #ff9800;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #ffa726; }
        button.secondary { background-color: #444; color: #fff; }
        button.action-btn { background-color: #0284c7; color: #fff; font-size: 13px; padding: 5px 10px; }
        button.action-btn:hover { background-color: #0369a1; }
        button.action-btn.active { background-color: #16a34a; }
        
        .manual-selectors {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
            background: #181818;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
        }
        .yao-select-row { display: flex; align-items: center; gap: 10px; }
        .yao-label { width: 50px; font-size: 14px; color: #ffca28; font-weight: bold; text-align: right; }
        .yao-select-row select { flex: 1; background: #222; border-color: #444; }
        
        /* 排盤結果區塊 */
        .output-container {
            background-color: #f8fafc;
            color: #1e293b;
            padding: 15px 20px;
            border-radius: 6px;
            font-family: "PingFang TC", "Microsoft JhengHei", monospace;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.6;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            max-width: 100%;
            box-sizing: border-box;
        }
        
        .meta-section { margin-bottom: 10px; font-size: 14px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .meta-line { margin-bottom: 4px; }
        .highlight-red { color: #dc2626; }
        .highlight-blue { color: #2563eb; }
        
        .shensha-line {
            display: none;
            margin-top: 6px; 
            font-weight: normal; 
            color: #334155;
            background-color: #f1f5f9;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }
        .shensha-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            align-items: center;
            font-size: 14px;
        }
        .shensha-title {
            font-weight: bold;
            color: #0f172a;
            margin-right: 2px;
        }
        .shensha-item {
            background-color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
        }
        
        .paipan-grid { 
            display: flex; 
            width: 100%; 
            margin-top: 5px; 
            justify-content: flex-start;
        }
        
        .liushen-col { 
            width: 60px; 
            display: flex; 
            flex-direction: column; 
            color: #475569; 
            padding-top: 32px; 
        }
        
        .fushen-col {
            width: 110px;
            display: none; 
            flex-direction: column;
            padding-top: 32px;
            border-right: 1px dashed #cbd5e1;
            margin-right: 10px;
            white-space: nowrap;
            letter-spacing: -0.5px;
        }
        .fushen-star {
            color: #228B22; 
            font-weight: bold;
            margin-right: 2px; 
        }
        .hidden-yao-highlight {
            color: #228B22; 
            font-weight: bold;
        }
        .hidden-yao-normal {
            color: #64748b; 
            font-weight: normal;
        }
        
        .gua-col { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            max-width: 100%;
        }
        
        .gua-header { 
            display: flex; 
            border-bottom: 1px solid #cbd5e1; 
            padding-bottom: 3px; 
            margin-bottom: 8px; 
            color: #0f172a; 
        }
        .gua-title { width: 250px; text-align: left; font-size: 15px; color: #0284c7; font-weight: 800; padding-left: 5px; }
        .gua-title.change-title { width: 260px; padding-left: 20px; color: #0284c7; }

        .yao-row { display: flex; align-items: center; height: 32px; }
        
        .yao-part { width: 220px; display: flex; align-items: center; position: relative; margin-right: 15px; color: #1e293b; }
        .yao-part.change-part { width: 250px; margin-right: 0; color: #1e293b; } 
        
        .liuqin-zhi { width: 80px; display: inline-block; letter-spacing: 0.5px; white-space: nowrap; }
        .nayin-box { width: 70px; display: none; font-size: 12px; color: #64748b; font-weight: normal; white-space: nowrap; text-align: left; }
        .yao-line-container { width: 90px; display: inline-flex; align-items: center; justify-content: center; }
        .shi-ying { width: 25px; text-align: center; color: #b45309; font-size: 14px; }
        .dong-mark { width: 35px; text-align: center; color: #dc2626; font-weight: bold; font-size: 15px; }
        
        .yao-line-pic { display: inline-block; height: 10px; vertical-align: middle; }
        .yao-line-pic.yang { width: 80px; background-color: #000; }
        .yao-line-pic.yin { width: 80px; background-image: linear-gradient(to right, #000 33.3%, transparent 33.3%, transparent 66.6%, #000 66.6%); }

        .history-list { max-height: 150px; overflow-y: auto; margin-top: 10px; }
        .history-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px; background: #262626; border-bottom: 1px solid #333; font-size: 13px;
        }
        .history-item:hover { background: #333; }
        .history-info { flex: 1; cursor: pointer; }

        .notes-section {
            margin-top: 15px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 12px;
            color: #1e293b;
        }
        .notes-title {
            font-size: 14px;
            color: #475569;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zoom-controls {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 6px;
            z-index: 9999;
            background: rgba(0,0,0,0.6);
            padding: 4px;
            border-radius: 6px;
        }
        .zoom-btn {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            width: 38px;
            height: 38px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .zoom-btn:active { background: #ff9800; color: #000; }
        
        .ganzhi-display-line {
            background: #252525;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #3d3d3d;
            font-size: 14px;
            color: #ffca28;
            font-weight: bold;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

            background: #1a1a1a;
            color: #ffca28;
            border: 1px solid #555;
            padding: 3px 5px;
            font-weight: bold;
            flex: none;
            min-width: 50px;
        }

</head>
<body>

    <h1>專業六爻排盤系統</h1>

    <div class="card">
        <div class="form-group">
            <label>所問之事：</label>
            <input type="text" id="memo" placeholder="例如：測今年財運、某項目能否成功...">
        </div>

        <div class="form-group">
            <label>占卜時間：</label>
            <select id="year" onchange="autoCalcTimeGZ()"></select>年
            <select id="month" onchange="autoCalcTimeGZ()"></select>月
            <select id="date" onchange="autoCalcTimeGZ()"></select>日
            <select id="hour" onchange="autoCalcTimeGZ()"></select>時
            <select id="minute" onchange="autoCalcTimeGZ()"></select>分
        </div>

        <div class="form-group">
            <label>對應干支：</label>
            <div class="ganzhi-display-line">
                <select id="gz-year-gan" onchange="syncManualGZ()"></select><select id="gz-year-zhi" onchange="syncManualGZ()"></select>年 &nbsp;
                <select id="gz-month-gan" onchange="syncManualGZ()"></select><select id="gz-month-zhi" onchange="syncManualGZ()"></select>月 &nbsp;
                <select id="gz-day-gan" onchange="syncManualGZ()"></select><select id="gz-day-zhi" onchange="syncManualGZ()"></select>日 &nbsp;
                <select id="gz-hour-gan" onchange="syncManualGZ()"></select><select id="gz-hour-zhi" onchange="syncManualGZ()"></select>時
                <span id="gz-xunkong-text" style="color:#f43f5e; margin-left:10px; font-size:14px;">(日空：計算中)</span>
            </div>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button style="flex: 2;" onclick="autoRoll()">電腦起卦 (隨記產生六爻)</button>
            <button class="secondary" style="flex: 1;" onclick="manualSubmit();">手動排盤</button>
        </div>

        <div class="manual-selectors">
            <div class="yao-select-row">
                <span class="yao-label">上爻：</span>
                <select id="yao-5"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">五爻：</span>
                <select id="yao-4"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">四爻：</span>
                <select id="yao-3"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">三爻：</span>
                <select id="yao-2"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">二爻：</span>
                <select id="yao-1"></select>
            </div>
            <div class="yao-select-row">
                <span class="yao-label">初爻：</span>
                <select id="yao-0"></select>
            </div>
        </div>
    </div>

    <div id="board-controls" style="margin-bottom:10px; display:none; text-align:right; gap:10px; justify-content:flex-end;">
        <button id="btn-shensha" class="action-btn" onclick="toggleShensha()">顯示 神煞</button>
        <button id="btn-fushen" class="action-btn" onclick="toggleFushen()">顯示 藏爻</button>
        <button id="btn-nayin" class="action-btn" onclick="toggleNayin()">顯示 納音</button>
    </div>

    <div id="paipan-board" class="output-container" style="display:none;">
        <div id="board-content"></div>
        
        <div class="notes-section">
            <div class="notes-title">
                <span>📝 斷卦筆記（內容自動儲存至當前紀錄）</span>
                <span id="save-status" style="color: #16a34a; font-weight: normal; font-size: 12px;"></span>
            </div>
            <textarea id="gua-notes" rows="4" placeholder="在此輸入此卦的吉凶判斷、應期、神煞取用等分析..." oninput="autoSaveNotes()"></textarea>
        </div>
    </div>

    <div class="card" style="margin-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #444; padding-bottom:5px;">
            <h3 style="margin:0; font-size:14px; color:#ffca28;">歷史占卦紀錄</h3>
            <button style="font-size:12px; padding:2px 6px; background:#dc2626; color:#fff;" onclick="clearHistory()">清空紀錄</button>
        </div>
        <div id="history-container" class="history-list"></div>
    </div>

    <div class="zoom-controls">
        <div class="zoom-btn" onclick="adjustZoom(0.05)">＋</div>
        <div class="zoom-btn" onclick="adjustZoom(-0.05)">－</div>
        <div class="zoom-btn" style="font-size:12px;" onclick="resetZoom()">重設</div>
    </div>

    function autoCalcTimeGZ() {
        let year = parseInt(document.getElementById("year").value);
        let month = parseInt(document.getElementById("month").value);
        let date = parseInt(document.getElementById("date").value);
        let hourVal = parseInt(document.getElementById("hour").value);

        let baseDate = new Date(2026, 4, 26, 12, 0, 0); 
        let targetDate = new Date(year, month - 1, date, 12, 0, 0);
        let diffDays = Math.round((targetDate.getTime() - baseDate.getTime()) / (1000 * 60 * 60 * 24));
        if (hourVal >= 23) { diffDays += 1; }

        let dayGanIdx = (0 + (diffDays % 10) + 10) % 10;
        let dayZhiIdx = (0 + (diffDays % 12) + 12) % 12;

        let yearGanIdx = (year - 4) % 10; if(yearGanIdx < 0) yearGanIdx += 10;
        let yearZhiIdx = (year - 4) % 12; if(yearZhiIdx < 0) yearZhiIdx += 12;

        let monthZhiMap = [ "丑","寅","卯","辰","巳","午","未","申","酉","戌","亥","子" ];
        let mZhiStr = monthZhiMap[(month - 1) % 12];
        let startMonthGans = {"甲":2, "己":2, "乙":4, "庚":4, "丙":6, "辛":6, "丁":8, "壬":8, "戊":0, "癸":0};
        let mStartIdx = startMonthGans[gans[yearGanIdx]];
        let mOffset = (zhis.indexOf(mZhiStr) - 2 + 12) % 12;
        let mGanStr = gans[(mStartIdx + mOffset) % 10];

        let hZhiStr = zhis[Math.floor((hourVal + 1) % 24 / 2)];
        let startHourGans = {"甲":0, "己":0, "乙":2, "庚":2, "丙":4, "辛":4, "丁":6, "壬":6, "戊":8, "癸":8};
        let hStartIdx = startHourGans[gans[dayGanIdx]];
        let hOffset = zhis.indexOf(hZhiStr);
        let hGanStr = gans[(hStartIdx + hOffset) % 10];

        document.getElementById("gz-year-gan").value = gans[yearGanIdx];
        document.getElementById("gz-year-zhi").value = zhis[yearZhiIdx];
        document.getElementById("gz-month-gan").value = mGanStr;
        document.getElementById("gz-month-zhi").value = mZhiStr;
        document.getElementById("gz-day-gan").value = gans[dayGanIdx];
        document.getElementById("gz-day-zhi").value = zhis[dayZhiIdx];
        document.getElementById("gz-hour-gan").value = hGanStr;
        document.getElementById("gz-hour-zhi").value = hZhiStr;

        syncManualGZ();
    }

    function checkChongHe(zhisArr) {
        const chongPairs = [["子","午"], ["午","子"], ["丑","未"], ["未","丑"], ["寅","申"], ["申","寅"], ["卯","酉"], ["酉","卯"], ["辰","戌"], ["戌","辰"], ["巳","亥"], ["亥","巳"]];
        const hePairs = [["子","丑"], ["丑","子"], ["寅","亥"], ["亥","寅"], ["卯","戌"], ["戌","卯"], ["辰","酉"], ["酉","辰"], ["巳","申"], ["申","巳"], ["午","未"], ["未","午"]];
        let isChong = true; let isHe = true;
        for(let i=0; i<3; i++) {
            let zhiLow = zhisArr[i]; let zhiUp = zhisArr[i+3];
            let matchChong = chongPairs.some(p => p[0]===zhiLow && p[1]===zhiUp); if(!matchChong) isChong = false;
            let matchHe = hePairs.some(p => p[0]===zhiLow && p[1]===zhiUp); if(!matchHe) isHe = false;
        }
        if(isChong) return "六沖";
        if(isHe) return "六合";
        return "";
    }

    function findGuaGongAndIndex(rawName) {
        for (let gong in jingFangEightGongs) {
            let idx = jingFangEightGongs[gong].indexOf(rawName);
            if (idx !== -1) { return { gong: gong, index: idx }; }
        }
        return { gong: "乾", index: 0 }; 
    }

    function buildGuaDetails(guaArr) {
        let lowStr = guaArr.slice(0,3).join(""); let upStr = guaArr.slice(3,6).join("");
        let lowName = baguaCode[lowStr]; let upName = baguaCode[upStr];
        
        let combinedKey = upName + lowName;
        let rawName = guaName64[combinedKey] || (baguaMing[upName] + baguaMing[lowName] + "卦");
        
        let findRes = findGuaGongAndIndex(rawName);
        let finalGong = findRes.gong;
        let gongIdx = findRes.index;
        let shi = gongIndexToShiYao[gongIdx];

        let patternList = [];
        let lowData = naJiaBase[lowName].low; let upData = naJiaBase[upName].up;
        let zhisOut = [];
        for(let i=0; i<3; i++) zhisOut.push(lowData.zhi[i]);
        for(let i=0; i<3; i++) zhisOut.push(upData.up ? upData.zhi[i] : naJiaBase[upName].up.zhi[i]);
        
        let chongHeRes = checkChongHe(zhisOut);
        if(chongHeRes) patternList.push(chongHeRes);
        
        if (gongIdx === 6) patternList.push("游魂");
        if (gongIdx === 7) patternList.push("歸魂");

        let patternStr = patternList.length > 0 ? ` (${patternList.join('・')})` : "";
        
        let gansOut = [];
        for(let i=0; i<3; i++) gansOut.push(lowData.gan[i]);
        for(let i=0; i<3; i++) gansOut.push(naJiaBase[upName].up.gan[i]);

        return { name: rawName, gong: finalGong, shi: shi, gans: gansOut, zhis: zhisOut, wuxing: naJiaBase[finalGong].wuxing, pattern: patternStr };
    }

    function getLiuQin(gongWX, yaoZhi) {
        let yaoWX = wuxing[yaoZhi];
        if (gongWX === yaoWX) return "兄弟";
        if (wuxingRelation[gongWX + "生" + yaoWX]) return "子孫";
        if (wuxingRelation[yaoWX + "生" + gongWX]) return "父母";
        if (gongWX === "土" && yaoWX === "水") return "妻財"; 
        if (gongWX === "金" && yaoWX === "木") return "妻財"; 
        if (wuxingRelation[gongWX + "克" + yaoWX]) return "妻財";
        if (wuxingRelation[yaoWX + "克" + gongWX]) return "官鬼";
        return "未知";
    }

    // ➔ 【核心修正】：重新精準編排神煞算法
    function getShenSha(dayGan, dayZhi, monthZhi) {
        let sha = {}; 
        const chong = {"子":"午","午":"子","丑":"未","未":"丑","寅":"申","申":"寅","卯":"酉","酉":"卯","辰":"戌","戌":"辰","巳":"亥","亥":"巳"};
        
        // 將星、桃花、驛馬、劫煞、華蓋
        if(["亥","卯","未"].includes(dayZhi)) { sha["將星"]="卯"; sha["桃花"]="子"; sha["驛馬"]="巳"; sha["劫煞"]="申"; sha["華蓋"]="未"; }
        else if(["寅","午","戌"].includes(dayZhi)) { sha["將星"]="午"; sha["桃花"]="卯"; sha["驛馬"]="申"; sha["劫煞"]="亥"; sha["華蓋"]="戌"; }
        else if(["巳","酉","丑"].includes(dayZhi)) { sha["將星"]="酉"; sha["桃花"]="午"; sha["驛馬"]="亥"; sha["劫煞"]="寅"; sha["華蓋"]="丑"; }
        else { sha["將星"]="子"; sha["桃花"]="酉"; sha["驛馬"]="寅"; sha["劫煞"]="巳"; sha["華蓋"]="辰"; }
        sha["災煞"] = chong[sha["將星"]];
        
        // 貴人、日祿
        if(["甲","戊"].includes(dayGan)) sha["貴人"]="丑未"; else if(["乙","己"].includes(dayGan)) sha["貴人"]="子申"; else if(["丙","丁"].includes(dayGan)) sha["貴人"]="亥酉"; else if(["庚","辛"].includes(dayGan)) sha["貴人"]="寅午"; else sha["貴人"]="卯巳";
        sha["日祿"] = {"甲":"寅","乙":"卯","丙":"巳","丁":"午","戊":"巳","己":"午","庚":"申","辛":"酉","壬":"亥","癸":"子"}[dayGan];
        
        // 1. 【羊刃修正】：甲卯 乙辰 丙午 丁未 戊午 己未 庚酉 辛戌 壬子 癸丑
        sha["羊刃"] = {"甲":"卯","乙":"寅","丙":"午","丁":"巳","戊":"午","己":"巳","庚":"酉","辛":"申","壬":"子","癸":"亥"}[dayGan];
        
        sha["文昌"] = {"甲":"巳","乙":"午","丙":"申","丁":"酉","戊":"申","己":"酉","庚":"亥","辛":"子","壬":"寅","癸":"卯"}[dayGan];
        sha["天醫"] = zhis[(zhis.indexOf(monthZhi) - 1 + 12) % 12];
        
        // 2. 【天喜修正】：依月支對應（正月的季後地支起算戌，依次順排）
        sha["天喜"] = {"寅":"戌","卯":"戌","辰":"戌","巳":"未","午":"未","未":"未","申":"辰","酉":"辰","戌":"辰","亥":"丑","子":"丑","丑":"丑"}[monthZhi];
        
        // 3. 【謀星修正】：根據日支查找三合局中土爻之相沖爻
        if (["申","子","辰"].includes(dayZhi)) { sha["謀星"] = "戌"; } // 局中土為辰，沖辰者戌
        else if (["巳","酉","丑"].includes(dayZhi)) { sha["謀星"] = "未"; } // 局中土為丑，沖丑者未
        else if (["寅","午","戌"].includes(dayZhi)) { sha["謀星"] = "辰"; } // 局中土為戌，沖戌者辰
        else if (["亥","卯","未"].includes(dayZhi)) { sha["謀星"] = "丑"; } // 局中土為未，沖未者丑
        else { sha["謀星"] = "無"; }

        return sha;
    }

    function calculateCangYaoDetails(mainInfo) {
        let gongName = mainInfo.gong; 
        let gongWX = mainInfo.wuxing;
        let mainGuaLiuqins = [];
        for(let i=0; i<6; i++) { mainGuaLiuqins.push(getLiuQin(gongWX, mainInfo.zhis[i])); }

        let pureArr = [];
        if(gongName==="乾") pureArr=[1,1,1,1,1,1];      
        else if(gongName==="坤") pureArr=[0,0,0,0,0,0]; 
        else if(gongName==="震") pureArr=[1,0,0,1,0,0]; 
        else if(gongName==="巽") pureArr=[0,1,1,0,1,1]; 
        else if(gongName==="坎") pureArr=[0,1,0,0,1,0]; 
        else if(gongName==="離") pureArr=[1,0,1,1,0,1]; 
        else if(gongName==="艮") pureArr=[0,0,1,0,0,1]; 
        else if(gongName==="兌") pureArr=[1,1,0,1,1,0]; 
        
        let lowName = baguaCode[pureArr.slice(0,3).join("")]; 
        let upName = baguaCode[pureArr.slice(3,6).join("")];
        let lowData = naJiaBase[lowName].low; 
        let upData = naJiaBase[upName].up;
        
        let pureGanzhi = [
            { gan: lowData.gan[0], zhi: lowData.zhi[0] },
            { gan: lowData.gan[1], zhi: lowData.zhi[1] },
            { gan: lowData.gan[2], zhi: lowData.zhi[2] },
            { gan: upData.gan[0], zhi: upData.zhi[0] },
            { gan: upData.gan[1], zhi: upData.zhi[1] },
            { gan: upData.gan[2], zhi: upData.zhi[2] }
        ];

        let resultList = []; 
        for(let i=0; i<6; i++) {
            let pureLQ = getLiuQin(gongWX, pureGanzhi[i].zhi);
            let displayString = `${pureLQ}${pureGanzhi[i].zhi}${wuxing[pureGanzhi[i].zhi]}`;
            let isFuYao = !mainGuaLiuqins.includes(pureLQ);
            resultList.push({ text: displayString, isFu: isFuYao });
        }
        return resultList;
    }

            let cy = cangYaoData[i];
            htm += `    <div class="yao-row">`;
            if(cy.isFu) { htm += `<span class="fushen-star">★</span><span class="hidden-yao-highlight">${cy.text}</span>`; } 
            else { htm += `<span class="hidden-yao-normal">&nbsp;&nbsp;${cy.text}</span>`; }
            htm += `    </div>`;
        }
        htm += `  </div>`;

        htm += `  <div class="gua-col">`;
        htm += `    <div class="gua-header">`;
        htm += `      <div class="gua-title">本卦：${mainInfo.gong}宮 [${mainInfo.wuxing}]：${mainInfo.name}${mainInfo.pattern}</div>`;
        if(!isQuietGua) {
            htm += `      <div class="gua-title change-title">變卦：${changeInfo.gong}宮 [${changeInfo.wuxing}]：${changeInfo.name}${changeInfo.pattern}</div>`;
        }
        htm += `    </div>`;

        for(let i=5; i>=0; i--) {
            htm += `    <div class="yao-row">`;
            
            htm += `      <div class="yao-part">`;
            let mLQ = getLiuQin(mainInfo.wuxing, mainInfo.zhis[i]);
            let mGan = mainInfo.gans[i];
            let mZhi = mainInfo.zhis[i];
            let mWX = wuxing[mZhi];
            let mNy = nayinMap[mGan+mZhi] || "";
            let nyDisp = showNayinState ? "inline-block" : "none";
            
            htm += `        <span class="liuqin-zhi">${mLQ}${mZhi}${mWX}</span>`;
            htm += `        <span class="nayin-box" style="display:${nyDisp};">[${mNy}]</span>`;
            
            let lineType = (currentGua[i] === 1 || currentGua[i] === 3) ? "yang" : "yin";
            htm += `        <span class="yao-line-container"><span class="yao-line-pic ${lineType}"></span></span>`;
            
            let seStr = "";
            if(mainInfo.shi === (i+1)) seStr = "世";
            else if(mainInfo.shi > 3 && (mainInfo.shi-3) === (i+1)) seStr = "應";
            else if(mainInfo.shi <= 3 && (mainInfo.shi+3) === (i+1)) seStr = "應";
            htm += `        <span class="shi-ying">${seStr}</span>`;
            
            let mDong = "";
            if(currentGua[i] === 3) mDong = "○";
            if(currentGua[i] === 0) mDong = "×";
            htm += `        <span class="dong-mark">${mDong}</span>`;
            htm += `      </div>`;

            if(!isQuietGua) {
                htm += `      <div class="yao-part change-part">`;
                let cLQ = getLiuQin(mainInfo.wuxing, changeInfo.zhis[i]);
                let cGan = changeInfo.gans[i];
                let cZhi = changeInfo.zhis[i];
                let cWX = wuxing[cZhi];
                let cNy = nayinMap[cGan+cZhi] || "";
                
                htm += `        <span class="liuqin-zhi">${cLQ}${cZhi}${cWX}</span>`;
                htm += `        <span class="nayin-box" style="display:${nyDisp};">[${cNy}]</span>`;
                
                let cLineType = (changeGuaArr[i] === 1) ? "yang" : "yin";
                htm += `        <span class="yao-line-container"><span class="yao-line-pic ${cLineType}"></span></span>`;
                
                let cSeStr = "";
                if(changeInfo.shi === (i+1)) cSeStr = "世";
                else if(changeInfo.shi > 3 && (changeInfo.shi-3) === (i+1)) cSeStr = "應";
                else if(changeInfo.shi <= 3 && (changeInfo.shi+3) === (i+1)) cSeStr = "應";
                htm += `        <span class="shi-ying">${cSeStr}</span>`;
                htm += `      </div>`;
            }
            htm += `    </div>`;
        }
        htm += `  </div>`;
        htm += `</div>`;

        document.getElementById("board-content").innerHTML = htm;
        document.getElementById("board-controls").style.display = "flex";
        document.getElementById("paipan-board").style.display = "block";
        
        let btnNayin = document.getElementById("btn-nayin");
        if(showNayinState) btnNayin.classList.add("active"); else btnNayin.classList.remove("active");
        let btnFushen = document.getElementById("btn-fushen");
        if(showFushenState) { btnFushen.classList.add("active"); btnFushen.innerText="隱藏 藏爻"; } else { btnFushen.classList.remove("active"); btnFushen.innerText="顯示 藏爻"; }
        let btnShensha = document.getElementById("btn-shensha");
        if(showShenshaState) { btnShensha.classList.add("active"); btnShensha.innerText="隱藏 神煞"; } else { btnShensha.classList.remove("active"); btnShensha.innerText="顯示 神煞"; }
    }

    function saveToHistory() {
        if(!currentRecordId) return;
        let memo = document.getElementById("memo").value || "未填寫";
        let year = document.getElementById("year").value;
        let month = document.getElementById("month").value;
        let date = document.getElementById("date").value;
        let hour = document.getElementById("hour").value;
        let min = document.getElementById("minute").value;
        let notes = document.getElementById("gua-notes").value;

        let mainGuaArr = currentGua.map(y => (y === 1 || y === 3) ? 1 : 0);
        let mainInfo = buildGuaDetails(mainGuaArr);

        let record = {
            id: currentRecordId,
            memo: memo,
            timeStr: `${year}-${month}-${date} ${hour.padStart(2,'0')}:${min.padStart(2,'0')}`,
            ganzhiStr: `${activeGanZhi.dayGan}${activeGanZhi.dayZhi}日(${activeGanZhi.monthZhi}月)`,
            guaName: mainInfo.name,
            guaData: [...currentGua],
            notes: notes,
            inputs: { year, month, date, hour, min },
            savedGZ: { ...activeGanZhi }
        };

        let history = JSON.parse(localStorage.getItem("liuxiao_history") || "[]");
        let idx = history.findIndex(r => r.id === currentRecordId);
        if(idx !== -1) { history[idx] = record; } else { history.unshift(record); }
        localStorage.setItem("liuxiao_history", JSON.stringify(history));
        renderHistory();
    }

    function autoSaveNotes() {
        if(!currentRecordId) return;
        let statusEl = document.getElementById("save-status");
        statusEl.innerText = "正在儲存...";
        saveToHistory();
        setTimeout(() => { statusEl.innerText = "筆記已自動儲存"; }, 400);
    }

    function renderHistory() {
        let history = JSON.parse(localStorage.getItem("liuxiao_history") || "[]");
        let container = document.getElementById("history-container");
        if(history.length === 0) {
            container.innerHTML = `<div style="padding:10px; color:#666; text-align:center;">暫無占卦紀錄</div>`;
            return;
        }
        let htm = "";
        history.forEach(r => {
            htm += `<div class="history-item">`;
            htm += `  <div class="history-info" onclick="loadRecord(${r.id})">`;
            htm += `    <span style="color:#ffca28; font-weight:bold;">[${r.guaName}]</span> `;
            htm += `    <span style="color:#fff;">${r.memo}</span> `;
            htm += `    <span style="color:#888; font-size:12px;">(${r.timeStr} | ${r.ganzhiStr})</span>`;
            htm += `  </div>`;
            htm += `  <button style="background:#444; font-size:12px; padding:1px 5px;" onclick="deleteRecord(${r.id})">刪除</button>`;
            htm += `</div>`;
        });
        container.innerHTML = htm;
    }

    function loadRecord(id) {
        let history = JSON.parse(localStorage.getItem("liuxiao_history") || "[]");
        let r = history.find(item => item.id === id);
        if(!r) return;

        currentRecordId = r.id;
        currentGua = [...r.guaData];
        syncGuaToSelectors();

        document.getElementById("memo").value = r.memo;
        if(r.inputs) {
            document.getElementById("year").value = r.inputs.year;
            document.getElementById("month").value = r.inputs.month;
            document.getElementById("date").value = r.inputs.date;
            document.getElementById("hour").value = r.inputs.hour;
            document.getElementById("minute").value = r.inputs.min;
        }
        document.getElementById("gua-notes").value = r.notes || "";
        document.getElementById("save-status").innerText = "";
        
        if(r.savedGZ) {
            document.getElementById("gz-year-gan").value = r.savedGZ.yearGan;
            document.getElementById("gz-year-zhi").value = r.savedGZ.yearZhi;
            document.getElementById("gz-month-gan").value = r.savedGZ.monthGan;
            document.getElementById("gz-month-zhi").value = r.savedGZ.monthZhi;
            document.getElementById("gz-day-gan").value = r.savedGZ.dayGan;
            document.getElementById("gz-day-zhi").value = r.savedGZ.dayZhi;
            document.getElementById("gz-hour-gan").value = r.savedGZ.hourGan;
            document.getElementById("gz-hour-zhi").value = r.savedGZ.hourZhi;
            syncManualGZ();
        } else {
            autoCalcTimeGZ();
        }
    }

    function deleteRecord(id) {
        let history = JSON.parse(localStorage.getItem("liuxiao_history") || "[]");
        history = history.filter(item => item.id !== id);
        localStorage.setItem("liuxiao_history", JSON.stringify(history));
        if(currentRecordId === id) {
            currentRecordId = null;
            document.getElementById("paipan-board").style.display = "none";
            document.getElementById("board-controls").style.display = "none";
        }
        renderHistory();
    }

    function clearHistory() {
        if(confirm("確定要清空所有歷史占卦紀錄嗎？")) {
            localStorage.removeItem("liuxiao_history");
            currentRecordId = null;
            document.getElementById("paipan-board").style.display = "none";
            document.getElementById("board-controls").style.display = "none";
            renderHistory();
        }
    }
</script>
